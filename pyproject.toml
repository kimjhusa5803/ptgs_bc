[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ptgs_bc"
version = "0.0.1.dev0"
description = "Bayesian-computing polygenic transcriptomic scores (PTGS) on GReX, benchmarked against an elastic-net baseline."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scikit-learn>=1.3",   # elastic-net baseline (+ CV utilities)
    "joblib>=1.3",          # serialize fitted score bundles
    "numpyro>=0.13",        # Bayesian shrinkage builder (JAX NUTS/SVI)
    "jax>=0.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=7",
    "jupyter",
    "ipykernel",
    "matplotlib>=3.7",
]

[project.scripts]
ptgs-bc = "ptgs_bc.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
